[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "six-framework-a2a-benchmark"
version = "0.1.0"
description = "Side-by-side task-board benchmark across Google ADK (+A2A), Strands, Pydantic AI, Microsoft Agent Framework, Agno, and Mastra with physical output verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
framework-bench = "framework_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
